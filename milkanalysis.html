<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMilk Analyzer</title>
    <link rel="stylesheet" href="milkanalysis.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <img src="bottel.jpg" alt="" />
        <div>
          <h3>Smart Milk Quality Analysis System</h3>
          <p>Real-time Milk Quality Monitoring and Pricing</p>
        </div>
      </nav>
    </header>
    <main>
      <div class="container">
        <div><h2>Live Milk Quality Data</h2></div>
        <div class="boxes">
          <div class="box box1">
            <h4>FAT</h4>
            <p>4.25%</p>
            <p class="state">Good</p>
          </div>
          <div class="box box2">
            <h4>SNF</h4>
            <p>8.62%</p>
            <p class="state">Good</p>
          </div>
          <div class="box box3">
            <h4>WATER</h4>
            <p>Not Detected</p>
            <p class="state">Safe</p>
          </div>
          <div class="box box4">
            <h4>TEMPERATURE</h4>
            <p>27.3 °C</p>
            <p class="state">Normal</p>
          </div>
          <div class="box box5">
            <h4>MILK PRICE</h4>
            <p>₹ 50.60</p>
            <p class="state">Per Liter</p>
          </div>
        </div>
      </div>
    </main>
    
  </body>
</html>
